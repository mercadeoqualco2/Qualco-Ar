<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUALCO AR</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#fff;
      font-family:Arial,Helvetica,sans-serif;
      color:#111;
      padding:24px;
    }
    main{width:min(560px,100%);text-align:center}
    h1{font-size:32px;margin:0 0 10px}
    p{font-size:16px;line-height:1.45;margin:0 0 28px;color:#555}
    a[rel="ar"]{display:block;text-decoration:none}
    a[rel="ar"] img{display:block;width:100%;height:auto}
    small{display:block;margin-top:18px;color:#777}
  </style>
</head>
<body>
  <main>
    <h1>QUALCO</h1>
    <p>Visualiza el producto en tu espacio.</p>
    <a rel="ar" href="./recarga.usdz">
      <img src="./ar-button.png" alt="Ver en realidad aumentada">
    </a>
    <small>Compatible con AR Quick Look en iPhone y iPad.</small>
  </main>
</body>
</html>
